<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Audit Evidence Explorer</title>
<style>
:root{--bg:#f4f6f9;--panel:#ffffff;--ink:#17202b;--muted:#4f5b6b;--line:#d5dce5;--soft:#eef2f7;--accent:#0b4f9c;--accent-ink:#ffffff;

--elig:#6cc0f5;--elig-bg:#12324a;--after:#ff9d5c;--after-bg:#3c2412;--before:#aab5c3;--before-bg:#242d3a;--amb:#f2c35b;--amb-bg:#3a2e10;
--miss:#f09ad0;--miss-bg:#3a1a30;--ok:#59d3ae;--ok-bg:#12372d;--bad:#ff8f87;--bad-bg:#431a18;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:var(--accent)}button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}

header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 18px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand svg{flex:none}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}

.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}.tab:hover:not([aria-selected=true]){background:var(--soft);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--panel);padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.notice{max-width:1500px;margin:0 auto;padding:6px 18px 10px;color:var(--muted);font-size:13px}
.notice strong{color:var(--ink)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;cursor:default}

.card .n{font-size:26px;font-weight:700;line-height:1.1}.card .l{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.b-COMPLETE,.b-ok,.b-compliant{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.b-INCOMPLETE,.b-violation,.b-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.b-NOT_APPLICABLE,.b-unknown,.b-neutral{background:var(--before-bg);color:var(--before);border-color:var(--before)}
.b-eligible,.b-retained{background:var(--elig-bg);color:var(--elig);border-color:var(--elig)}
.b-after_audit{background:var(--after-bg);color:var(--after);border-color:var(--after);border-style:dashed}
.b-before_request{background:var(--before-bg);color:var(--before);border-color:var(--before)}
.b-ambiguous,.b-weak{background:var(--amb-bg);color:var(--amb);border-color:var(--amb);border-style:dashed}
.b-missing{background:var(--miss-bg);color:var(--miss);border-color:var(--miss)}
.layout{scroll-margin-top:112px;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:14px;align-items:start;margin-top:14px}
@media (max-width:980px){.layout{grid-template-columns:1fr}.layout.has-case .listcol{display:none}.layout:not(.has-case) .detailcol{display:none}}
.listcol{position:sticky;top:104px;max-height:calc(100vh - 120px);display:flex;flex-direction:column}
@media (max-width:980px){.listcol{position:static;max-height:none}}
.filters{display:grid;gap:8px;margin-bottom:10px}

.list{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);flex:1;min-height:120px}

.item:hover{background:var(--soft)}.item[aria-current=true]{background:var(--elig-bg);box-shadow:inset 4px 0 0 var(--accent)}
.item .r1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}.item .r2{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600}.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dtabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0}
.dtab{border:0;background:transparent;padding:9px 13px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.dtab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}

.scroll{overflow-x:auto}.mono{font-family:var(--mono);font-size:13px}.muted{color:var(--muted)}.small{font-size:13px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center;background:var(--soft)}
.callout{border-left:4px solid var(--accent);background:var(--soft);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0}

.bars{display:grid;gap:6px}.brow{display:grid;grid-template-columns:minmax(120px,210px) 1fr 54px;gap:8px;align-items:center;font-size:13px}

.brow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.stack{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:8px 0}.legend span{display:inline-flex;align-items:center;gap:6px}
.chain{display:grid;grid-template-columns:1fr;gap:26px}
.node{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);position:relative;min-width:0}.node h4{margin-bottom:6px}
.node::after{content:"\2193";position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:20px;line-height:22px;color:var(--muted);width:24px;text-align:center}
.node:last-child::after{display:none}
.node.wide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}.node.wide>h4{grid-column:1/-1}@media (max-width:1100px){.node.wide{grid-template-columns:1fr}}

.obs.after_audit{border-style:dashed;border-color:var(--after)}.obs.before_request{opacity:.85}
.hit{background:var(--elig-bg);color:var(--elig);border-radius:4px;padding:0 4px;font-weight:700}
.tl-wrap{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow-x:auto}
svg text{font-family:var(--sans);font-size:11px;fill:var(--ink)}svg .lane{stroke:var(--line)}svg .axis{stroke:var(--muted)}
.sym-elig{fill:var(--elig)}.sym-after{fill:var(--after);stroke:var(--after)}.sym-before{fill:none;stroke:var(--before);stroke-width:2}.sym-claim{fill:var(--before)}

.sec{margin:18px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:900px){.two{grid-template-columns:1fr}}
.srow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}

@media (max-width:700px){header.top{position:static}.brand small{display:none}.bar{padding:8px 12px}.notice{padding:4px 12px 8px;font-size:12px}main{padding:12px}.seg{margin-left:0}}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
